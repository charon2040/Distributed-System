events {}
http {
  include /etc/nginx/mime.types;
  # 轮询
  upstream backend_round_robin {
    server backend1:8081;
    server backend2:8082;
  }
  # 最少连接
  upstream backend_least_conn {
    least_conn;
    server backend1:8081;
    server backend2:8082;
  }
  # 同一客户端 IP 固定命中同一实例
  upstream backend_ip_hash {
    ip_hash;
    server backend1:8081;
    server backend2:8082;
  }
  # 基于 URI 的一致性哈希
  upstream backend_uri_hash {
    hash $request_uri consistent;
    server backend1:8081;
    server backend2:8082;
  }
  server {
    listen 80;
    # 默认 API 走最少连接
    location /api/ {
      proxy_pass http://backend_least_conn;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # 轮询演示入口
    location /api-rr/ {
      proxy_pass http://backend_round_robin/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # IP 哈希演示入口
    location /api-ip/ {
      proxy_pass http://backend_ip_hash/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # URI 哈希演示入口
    location /api-hash/ {
      proxy_pass http://backend_uri_hash/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # 静态资源与前端路由回退
    location / {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;
    }
  }
}
