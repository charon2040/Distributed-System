services:
  # MySQL 主库：负责写入并输出 binlog
  mysql-master:
    image: mysql:8.0
    container_name: ds-mysql-master
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: ds
    ports:
      - "3307:3306"
    volumes:
      - ./db/mysql/master.cnf:/etc/mysql/conf.d/master.cnf:ro
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/mysql/init-master.sql:/docker-entrypoint-initdb.d/02-init-master.sql:ro
  # MySQL 从库：用于只读查询
  mysql-replica:
    image: mysql:8.0
    container_name: ds-mysql-replica
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3308:3306"
    volumes:
      - ./db/mysql/replica.cnf:/etc/mysql/conf.d/replica.cnf:ro
      - ./db/mysql/init-replica.sh:/docker-entrypoint-initdb.d/01-init-replica.sh:ro
    depends_on:
      - mysql-master
  # 缓存服务
  redis:
    image: redis:7
    container_name: ds-redis
    ports:
      - "6379:6379"
  # 搜索服务（可选功能）
  elasticsearch:
    image: docker.1ms.run/library/elasticsearch:8.14.3
    container_name: ds-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    ports:
      - "9200:9200"
  kafka:
    image: apache/kafka:3.8.0
    container_name: ds-kafka
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - CLUSTER_ID=abcdefghijklmnopqrstuv
    ports:
      - "9092:9092"
  # 后端实例 1
  backend1:
    build:
      context: ./backend-springboot
    container_name: ds-backend-1
    environment:
      SPRING_DATASOURCE_WRITE_JDBC_URL: jdbc:mysql://mysql-master:3306/ds?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci
      SPRING_DATASOURCE_WRITE_USERNAME: root
      SPRING_DATASOURCE_WRITE_PASSWORD: rootpass
      SPRING_DATASOURCE_WRITE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_READ_JDBC_URL: jdbc:mysql://mysql-replica:3306/ds?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci
      SPRING_DATASOURCE_READ_USERNAME: root
      SPRING_DATASOURCE_READ_PASSWORD: rootpass
      SPRING_DATASOURCE_READ_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INSTANCE_NAME: backend-1
      SERVER_PORT: 8081
    depends_on:
      mysql-master:
        condition: service_started
      mysql-replica:
        condition: service_started
      redis:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_started
  # 后端实例 2
  backend2:
    build:
      context: ./backend-springboot
    container_name: ds-backend-2
    environment:
      SPRING_DATASOURCE_WRITE_JDBC_URL: jdbc:mysql://mysql-master:3306/ds?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci
      SPRING_DATASOURCE_WRITE_USERNAME: root
      SPRING_DATASOURCE_WRITE_PASSWORD: rootpass
      SPRING_DATASOURCE_WRITE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_READ_JDBC_URL: jdbc:mysql://mysql-replica:3306/ds?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci
      SPRING_DATASOURCE_READ_USERNAME: root
      SPRING_DATASOURCE_READ_PASSWORD: rootpass
      SPRING_DATASOURCE_READ_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INSTANCE_NAME: backend-2
      SERVER_PORT: 8082
    depends_on:
      mysql-master:
        condition: service_started
      mysql-replica:
        condition: service_started
      redis:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_started
  # Nginx 网关与静态资源服务
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: ds-web
    ports:
      - "8080:80"
    depends_on:
      - backend1
      - backend2
