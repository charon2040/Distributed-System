server:
  port: 8080

spring:
  application:
    name: seckill-backend
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      discovery:
        namespace: ${NACOS_NAMESPACE:public}
        group: DEFAULT_GROUP
        service: seckill-backend
      config:
        namespace: ${NACOS_NAMESPACE:public}
        group: DEFAULT_GROUP
        file-extension: yaml
        refresh-enabled: true
  datasource:
    # 写库连接
    write:
      jdbc-url: jdbc:mysql://localhost:3306/ds?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci
      username: root
      password: rootpass
      driver-class-name: com.mysql.cj.jdbc.Driver
    # 读库连接
    read:
      jdbc-url: jdbc:mysql://localhost:3306/ds?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci
      username: root
      password: rootpass
      driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  # ES 地址
  elasticsearch:
    uris: http://localhost:9200
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: seckill-order-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

mybatis:
  configuration:
    # 下划线字段自动映射到驼峰属性
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh

governance:
  dynamic-message: "default message (override from nacos config)"
